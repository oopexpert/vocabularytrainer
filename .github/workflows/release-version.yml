name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.version.outputs.skip }}
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -e
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi
          echo "Last tag: $LAST_TAG"

          COMMITS=$(git log $RANGE --pretty=format:"%s%n%b" || true)

          BUMP="none"
          if echo "$COMMITS" | grep -qE '(^|\n)[a-z]+(\(.+\))?!:|BREAKING CHANGE:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '(^|\n)feat(\(.+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qE '(^|\n)fix(\(.+\))?:'; then
            BUMP="patch"
          fi

          echo "Bump: $BUMP"
          if [ "$BUMP" = "none" ]; then
            echo "No release-relevant commits found. Exiting."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' vocabularytrainer/pom.xml | head -n1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$(echo "$CURRENT" | sed 's/-SNAPSHOT//')"

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump version and changelog
        if: steps.version.outputs.skip == 'false'
        run: |
          set -e
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          sed -i "0,/<version>.*<\/version>/s//<version>${NEW_VERSION}<\/version>/" vocabularytrainer/pom.xml

          DATE=$(date +%Y-%m-%d)
          LAST_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          {
            echo "## ${NEW_VERSION} (${DATE})"
            echo
            if [ -z "$LAST_TAG" ]; then
              git log --pretty=format:"- %s"
            else
              git log "${LAST_TAG}..HEAD" --pretty=format:"- %s"
            fi
            echo
            echo
            [ -f vocabularytrainer/CHANGELOG.md ] && cat vocabularytrainer/CHANGELOG.md
          } > /tmp/CHANGELOG.new.md
          mv /tmp/CHANGELOG.new.md vocabularytrainer/CHANGELOG.md

      - name: Commit and tag
        if: steps.version.outputs.skip == 'false'
        run: |
          set -e
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vocabularytrainer/pom.xml vocabularytrainer/CHANGELOG.md
          git commit -m "chore(release): v${NEW_VERSION}"
          git tag "v${NEW_VERSION}"
          BRANCH="${GITHUB_REF#refs/heads/}"
          git push origin "HEAD:${BRANCH}"
          git push origin "v${NEW_VERSION}"

  build:
    needs: version
    if: needs.version.outputs.skip == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            zip-name: VocabularyTrainer-linux-x64.zip
            jdk-bin-suffix: ""
          - os: windows-latest
            zip-name: VocabularyTrainer-windows-x64.zip
            jdk-bin-suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.new_version }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build distribution
        working-directory: vocabularytrainer
        run: mvn -B -Pdistribution -DskipTests "-Ddist.zip.name=${{ matrix.zip-name }}" "-Djdk.bin.suffix=${{ matrix.jdk-bin-suffix }}" clean install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip-name }}
          path: vocabularytrainer/dist/${{ matrix.zip-name }}

  release:
    needs: [version, build]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.new_version }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NEW_VERSION="${{ needs.version.outputs.new_version }}"
          PREV_TAG=$(git tag --list 'v*.*.*' --sort=-v:refname | sed -n 2p)

          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s")
          else
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s")
          fi

          gh release create "v${NEW_VERSION}" artifacts/*.zip \
            --title "v${NEW_VERSION}" \
            --notes "$NOTES"

